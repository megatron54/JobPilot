[project]
name = "jobpilot"
version = "0.1.0"
description = "AI-powered job application assistant using local LLMs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "sse-starlette>=2.1",
    "markitdown[all]>=0.1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
scraping = [
    "playwright>=1.44",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
